# Publie le site vitrine (dossier site/) et la web-app « Révisio sur téléphone » (site/app/, compilée ici)
# sur GitHub Pages à chaque envoi sur main.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "app.html"
      - "mobile-public/**"
      - "vite.mobile.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Web-app « Révisio sur téléphone »
        run: |
          npm ci
          npm run build:mobile
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
